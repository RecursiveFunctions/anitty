name: Release Windows

on:
  push:
    tags:
      - "windows-v*"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4.1-windows.1 (leave empty to auto-generate from upstream version + short SHA)"
        required: false
        type: string
      sync_upstream:
        description: "Sync with upstream ghostty-org/ghostty main before building"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      SYNC_UPSTREAM: ${{ inputs.sync_upstream }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync with upstream ghostty-org/ghostty
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_upstream)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ghostty-org/ghostty.git 2>$null
          git fetch upstream main
          $behind = [int](git rev-list --count HEAD..upstream/main)
          Write-Host "Commits behind upstream/main: $behind"
          if ($behind -gt 0) {
            git merge --no-edit upstream/main
            if ($LASTEXITCODE -ne 0) {
              git merge --abort
              throw "Merge conflict with upstream/main; manual conflict resolution required."
            }
            if ($env:REF_TYPE -eq 'branch') {
              git push origin "HEAD:$env:REF_NAME"
            }
          } elseif ($env:EVENT_NAME -eq 'schedule') {
            Write-Host "Already up to date with upstream/main."
          }

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          cache-key: release-windows-${{ hashFiles('build.zig.zon') }}

      - name: Fetch dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            zig build --fetch -Dapp-runtime=win32
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION -replace '^windows-v', ''
          } elseif ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^windows-v') {
            $v = $env:REF_NAME -replace '^windows-v', ''
          } else {
            $zon = Get-Content build.zig.zon -Raw
            if ($zon -match '\.version\s*=\s*"([^"]+)"') {
              $base = $Matches[1] -replace '-dev$', ''
            } else {
              throw "Could not parse version from build.zig.zon"
            }
            $sha = (git rev-parse --short=7 HEAD).Trim()
            $v = "$base-windows.$sha"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "invalid version '$v'" }
          $headSha = (git rev-parse HEAD).Trim()
          [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$v`nTAG=windows-v$v`nTARGET_SHA=$headSha`n")

      - name: Build
        shell: pwsh
        run: zig build -Dapp-runtime=win32 -Doptimize=ReleaseFast -Dcpu=baseline "-Dversion-string=$env:VERSION" -p build/release

      - name: Test
        run: zig build test -Dapp-runtime=win32

      - name: Sign executable
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./dist/windows/sign-file.ps1 -FilePath build/release/bin/ghostty.exe

      - name: Package zip
        shell: pwsh
        run: ./dist/windows/make-zip.ps1 -Prefix build/release -Version $env:VERSION

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows\out\staging\ghostty" "/DOutputDir=$PWD\dist\windows\out" dist\windows\installer\ghostty.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./dist/windows/sign-file.ps1 -FilePath "dist/windows/out/ghostty-$env:VERSION-windows-x86_64-setup.exe"

      - name: Collect assets
        shell: pwsh
        run: |
          $out = 'dist/windows/out'
          $assets = New-Item -ItemType Directory -Force 'release-assets'
          Copy-Item "$out/ghostty-$env:VERSION-windows-x86_64.zip" "$assets/Ghostty-Windows-x64.zip"
          Copy-Item "$out/ghostty-$env:VERSION-windows-x86_64-setup.exe" "$assets/Ghostty-Windows-Setup-x64.exe"
          Get-ChildItem $assets -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii "$assets/SHA256SUMS.txt"
          Get-Content "$assets/SHA256SUMS.txt"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $files = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --repo $env:REPOSITORY --clobber
          } else {
            $signingNotice = if ($env:CODESIGNED -eq 'true') {
              "All release binaries and the installer are Authenticode code-signed and SHA-256 checksums are published in ``SHA256SUMS.txt``. You can also upgrade in-place via **Command Palette → Check for Updates**."
            } else {
              "If this build was produced without a code-signing certificate configured, Windows SmartScreen may ask you to confirm (More info, then Run anyway). Verify downloads against ``SHA256SUMS.txt``, or upgrade in-place via **Command Palette → Check for Updates**."
            }
            $notes = "Ghostty for Windows $env:VERSION, an unofficial community port of [Ghostty](https://github.com/ghostty-org/ghostty).`n`n> [!IMPORTANT]`n> **Do not report Windows bugs to upstream ``ghostty-org/ghostty``.** Report all Windows issues and crash reports at [RecursiveFunctions/ghostty-windows/issues](https://github.com/RecursiveFunctions/ghostty-windows/issues).`n`n**Install:** download ``Ghostty-Windows-Setup-x64.exe`` and run it (per-user, no admin needed).`n**Portable:** unzip ``Ghostty-Windows-x64.zip`` and run ``ghostty\bin\ghostty.exe``.`n**In-App Update:** run ``Check for Updates`` from the Command Palette (`ctrl+shift+p`) to automatically download, SHA-256 verify, and install updates.`n`n$signingNotice`n`n**Provenance & AI Disclosure:** Built on [ghostty-org/ghostty](https://github.com/ghostty-org/ghostty) with initial Win32 runtime foundation from [phalladar/ghostty-windows](https://github.com/phalladar/ghostty-windows). The Zig 0.17 / Ghostty 1.4.1-dev port, CI pipeline, and Win32 feature parity implementation were developed with AI assistance using Kilo Code (see ``README-windows.md`` for full details)."
            gh release create $env:TAG @files --repo $env:REPOSITORY --target $env:TARGET_SHA --title "Ghostty for Windows $env:VERSION" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
